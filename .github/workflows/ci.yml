name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Show toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Build universal app
        run: bash scripts/build-app.sh --universal
      - name: Validate packaged app
        run: |
          codesign --verify --deep --strict "dist/Less Bar.app"
          ARCHS="$(lipo -archs "dist/Less Bar.app/Contents/MacOS/LessBar")"
          [[ " $ARCHS " == *" arm64 "* && " $ARCHS " == *" x86_64 "* ]]
          test -d "dist/Less Bar.app/Contents/Resources/LessBar_LessBar.bundle"
          plutil -lint "dist/Less Bar.app/Contents/Info.plist"
      - name: Archive development build
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Less Bar.app" dist/Less-Bar-development.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Less-Bar-development-universal
          path: dist/Less-Bar-development.zip
          retention-days: 14
